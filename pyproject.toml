[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "progress-studio"
version = "2.3.0"
description = "Desktop and command-line tools for schedule XML normalization, progress workbooks, BOQ mapping, payment, and rebuild."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1,<4",
    "matplotlib>=3.8,<4",
    "Pillow>=10,<12",
]

[project.scripts]
progress-studio = "progress_studio.entrypoints:desktop_main"
progress-studio-cli = "progress_studio.entrypoints:cli_main"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["progress_studio*"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "unit: isolated domain/parser/helper tests",
    "smoke: fastest high-value handoff gate",
    "integration: component and workflow boundary tests",
    "regression: product bugs/contracts that must not return",
    "acceptance: release-level product acceptance tests",
    "release: complete release gate; every collected test belongs here",
]
[tool.setuptools.package-data]
"progress_studio.config" = ["payment_lines.json"]
